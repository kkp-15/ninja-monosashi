<style>
/* OBS のウィンドウキャプチャで取り込む表示ページ。枠・背景・待ち画面・クレジットは kit の k-view。
   操作画面（同じブラウザ）から KKit.live で受け取って描くだけ。字は kit の --k-v-*（どのウィンドウでも 1/3 で14px以上） */
[hidden]{display:none!important}
.ms-title{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-tag{flex:none;padding:.1em .6em;background:var(--k-sumi);color:#fff;border-radius:max(4px,.4cqw);font-family:var(--k-head);font-weight:800}
.ms-tag.on{background:var(--k-shu)}
.ms-score{flex:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.ms-score b{color:var(--k-shu)}
@container (max-width:1100px){ .ms-tag{display:none} }

.k-view-body{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;row-gap:calc(var(--k-v-pad)*.4)}
.withqr .k-view-body{padding-right:calc(23cqw + var(--k-v-pad))}
/* ヒントの行（1行に収める。長いときは字を縮める） */
.ms-hint{display:flex;align-items:baseline;justify-content:center;gap:max(12px,1.6cqw);min-width:0}
.ms-hint .k{flex:none;font-size:var(--k-v-min);font-weight:800;color:var(--k-text-2)}
.ms-hint b{display:block;min-width:0;font-family:var(--k-head);font-weight:800;font-size:var(--k-v-l);line-height:1.2}
.ms-hint b.rule{color:var(--k-shu);font-size:var(--k-v-m)}
/* ものさし（大きく・縦の中央） */
.ms-mid{display:flex;flex-direction:column;justify-content:safe center;min-height:0}
.ms-guessrow{position:relative;height:calc(var(--k-v-min)*1.5)}
.ms-glabel{position:absolute;bottom:max(8px,1.6cqw);transform:translateX(-50%);background:var(--k-sumi);color:#fff;font-size:var(--k-v-min);font-weight:800;line-height:1.2;padding:.08em .5em;border-radius:max(4px,.5cqw);white-space:nowrap;transition:left .35s}
.ms-bar{--k-ruler-u:calc(12.5cqw/96);height:12.5cqw;flex:none}
@container (max-width:1500px){ .ms-bar{--k-ruler-u:calc(11cqw/96);height:11cqw} }
@container (max-width:1100px){ .ms-bar{--k-ruler-u:calc(9cqw/96);height:9cqw} .ms-hint b{font-size:var(--k-v-min)} .ms-hint b.rule{font-size:var(--k-v-min)} .ms-res .k-stamp{width:104px;height:104px} .ms-guessrow{height:calc(var(--k-v-min)*1.35)} .ms-glabel{bottom:6px} .ms-ends{margin-top:2px} }
.ms-bar .k-ruler-needle{transition:left .35s}
.ms-bar .k-ruler-zone>b{font-size:var(--k-v-min);font-family:var(--k-head);font-weight:800}
.ms-bar .k-ruler-cover>span{font-size:var(--k-v-min)}
.ms-ends{display:flex;justify-content:space-between;align-items:flex-start;gap:max(12px,2cqw);margin-top:max(6px,.8cqw)}
.ms-ends span{max-width:46%;font-family:var(--k-head);font-size:var(--k-v-m);font-weight:800;line-height:1.15;word-break:auto-phrase}
.ms-ends .mid{flex:none;font-size:var(--k-v-min);color:var(--k-text-2)}
.ms-ends .r{text-align:right}
/* 下の段（めくったあと: 正解・差・点の判子／当たりの範囲） */
.ms-foot{min-height:calc(var(--k-v-min)*1.3)}
.ms-call{margin:0;text-align:center;font-size:var(--k-v-min);font-weight:800;color:var(--k-text-2);line-height:1.3}
.ms-res{display:flex;align-items:center;justify-content:center;gap:max(12px,2cqw)}
.ms-res .k-result{display:flex;align-items:baseline;gap:.3em;border-width:max(10px,1cqw) max(28px,2.6cqw);border-image-width:max(10px,1cqw) max(28px,2.6cqw);padding:0 max(8px,.8cqw)}
.ms-res .k-result small{display:inline;font-size:var(--k-v-min);line-height:1.1}
.ms-res .k-result b{display:inline;font-family:var(--k-head);font-weight:800;font-size:var(--k-v-l);line-height:1.1}
.ms-res .sa{font-size:var(--k-v-m);font-weight:800;white-space:nowrap}
.ms-res .sa b{font-family:var(--k-head)}
.ms-res .k-stamp{flex:none;width:max(124px,10cqw);height:max(124px,10cqw);font-size:max(42px,3.4cqw);line-height:1.05}
.ms-ranges{display:flex;flex-direction:column;align-items:flex-start;margin:0;font-size:var(--k-v-min);font-weight:800;line-height:1.3}
.ms-ranges span{white-space:nowrap}
.ms-ranges .r4{color:#a9430b}
.ms-near{color:var(--k-shu)}
@container (max-width:1100px){ .ms-ranges .r3,.ms-ranges .r2{display:none} }
/* 最後の結果 */
.ms-end{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:max(10px,1.4cqw);padding:0 calc(var(--k-v-pad)*2.4);background:var(--k-kinari) url(/kit/img/d4-washi.webp) 0 0/420px auto}
.ms-end .k-result{border-width:max(14px,1.4cqw) max(40px,3.6cqw);border-image-width:max(14px,1.4cqw) max(40px,3.6cqw);padding:0 max(12px,1.2cqw)}
.ms-end .k-result small{font-size:var(--k-v-min);line-height:1.2}
.ms-end .k-result b{font-family:var(--k-head);font-weight:800;font-size:var(--k-v-xl);line-height:1.1}
.ms-end .k-result b small{display:inline;font-size:var(--k-v-m);color:var(--k-text-2)}
.ms-end .k-stamp{position:absolute;right:8cqw;top:50%;width:max(150px,17cqw);height:max(150px,17cqw);margin-top:min(-75px,-8.5cqw);font-size:max(48px,5cqw);line-height:1.05}
.ms-end p{margin:0;max-width:60%;font-size:var(--k-v-min);font-weight:800;line-height:1.35}
/* 答えのQR（配信者が当てる） */
.qrbox{background:#fff;padding:max(4px,.6cqw);border-radius:max(4px,.8cqw);line-height:0;border:max(2px,.2cqw) solid var(--k-sumi)}
.qrbox svg{display:block;width:100%;height:auto}
.qr-big{position:absolute;inset:0;z-index:7;display:flex;align-items:center;gap:4cqw;padding:0 4cqw;background:var(--k-kinari) url(/kit/img/d4-washi.webp) 0 0/420px auto}
.qr-big .qrbox{flex:none;width:min(33cqw,72cqh)}
.qr-big .qtx{min-width:0;flex:1}
.qr-big p{margin:0}
.qr-big .q1{font-size:var(--k-v-l);font-weight:800;line-height:1.2}
.qr-big .addr{font-size:var(--k-v-min);font-weight:800;margin-top:max(6px,.8cqw);word-break:break-all;line-height:1.25}
.qr-big .pass{font-size:var(--k-v-min);color:var(--k-text-2);font-weight:800;margin-top:max(8px,1.2cqw)}
.qr-big .pass b{display:block;font-family:var(--k-head);font-size:var(--k-v-xl);color:var(--k-sumi);letter-spacing:.06em;line-height:1.1;font-variant-numeric:tabular-nums}
.qr-big .rule{font-size:var(--k-v-min);font-weight:800;color:var(--k-shu);margin-top:max(8px,1.2cqw);line-height:1.3}
.qr-big .left{font-size:var(--k-v-min);color:var(--k-text-2);font-weight:700;margin-top:max(4px,.6cqw)}
@container (max-width:1300px){ .qr-big .left{display:none} }
.qr-small{position:absolute;right:var(--k-v-pad);top:calc(var(--k-v-pad)*.6);width:21cqw;z-index:4;text-align:center}
.qr-small .k{font-size:var(--k-v-min);color:var(--k-text-2);font-weight:800;margin-top:max(4px,.5cqw);line-height:1.2}
.qr-small b{display:block;font-family:var(--k-head);font-size:var(--k-v-m);font-weight:800;letter-spacing:0;line-height:1.15;white-space:nowrap}
</style>
</head>
<body class="k-view">
<div class="k-view-stage" id="screen">
  <header class="k-view-top"><span class="ms-title" id="sName">みんなのものさし</span><span class="ms-tag" id="sTag" hidden></span><span class="ms-score" id="sScore"></span></header>
  <main class="k-view-body" id="sBody">
    <div class="ms-hint"><span class="k" id="sHintK">ヒント</span><b id="sHint"></b></div>
    <div class="ms-mid">
      <div class="ms-guessrow"><span class="ms-glabel" id="sGlabel" hidden></span></div>
      <div class="ms-bar k-ruler" id="sBar">
        <div class="k-ruler-face">
          <i class="k-ruler-zone k-ruler-z2" id="z2"><b>2</b></i>
          <i class="k-ruler-zone k-ruler-z3" id="z3"><b>3</b></i>
          <i class="k-ruler-zone k-ruler-z4" id="z4"><b>4</b></i>
          <i class="k-ruler-mark" id="zMark"></i>
        </div>
        <i class="k-ruler-needle" id="sNeedle" hidden></i>
        <div class="k-ruler-cover"><span>正解はかくれています</span></div>
      </div>
      <div class="ms-ends"><span id="sL">0</span><span class="mid">50</span><span class="r" id="sR">100</span></div>
    </div>
    <div class="ms-foot" id="sFoot"></div>
    <div class="qr-small" id="sQrSmall" hidden></div>
    <div class="qr-big" id="sQrBig" hidden></div>
    <div class="ms-end" id="sEnd" hidden></div>
  </main>
  <div class="k-view-idle" id="sIdle"><b>みんなのものさし</b><p>まもなく始まります</p><small>操作ページで始めると、ここに出ます</small></div>
  <footer class="k-view-credit">みんなのものさし｜monosashi.kkpwebninja.com</footer>
</div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var clamp = function (x, a, b) { return Math.max(a, Math.min(b, x)); };
  var RANGE = { 4: 3, 3: 8, 2: 14 };
  var span = function (t, d) { return clamp(t - d, 0, 100) + '〜' + clamp(t + d, 0, 100); };
  var score = function (d) { return d <= 3 ? 4 : d <= 8 ? 3 : d <= 14 ? 2 : 0; };
  var ADDR = 'monosashi.kkpwebninja.com/a', QR_BASE = 'https://monosashi.kkpwebninja.com/a/#';
  var V = KKit.view({ ch: 'kkp-monosashi' });
  var S = null, last = {}, qrFor = '', qrSvg = '';
  function set(id, key, html) { if (last[id] === key) return false; last[id] = key; $(id).innerHTML = html; return true; }
  function fitAll() {
    KKit.fitText($('sName'), { min: 42 });
    KKit.fitText($('sHint'), { min: 42 });
    KKit.fitText($('sL'), { min: 42 }); KKit.fitText($('sR'), { min: 42 });
    var p = document.querySelector('#sQrBig .q1'); if (p) KKit.fitText(p, { min: 42 });
    var c = document.querySelector('#sQrSmall b'); if (c && !$('sQrSmall').hidden) KKit.fitText(c, { min: 42 });
  }

  function render() {
    var s = S;
    if (!s || s.phase === 'idle') { V.idle(true, s ? s.title : 'みんなのものさし'); return; }
    V.idle(false);
    var self = s.mode === 'self', ph = s.phase, inRound = ph !== 'end';
    if ($('sName').textContent !== s.title) { $('sName').textContent = s.title || 'みんなのものさし'; }
    $('sScore').innerHTML = '第' + Math.max(1, s.round) + '問 / ' + s.rounds + '　<b>' + s.total + '</b>点';
    var tag = $('sTag');
    tag.hidden = ph === 'end';
    tag.className = 'ms-tag' + (ph === 'reveal' ? ' on' : '');
    tag.textContent = self ? ({ set: 'ヒントをコメント', reveal: '正解' }[ph] || '') : ({ guess: '数字をコメント', set: 'まもなく正解', reveal: '正解' }[ph] || '');
    $('screen').classList.toggle('withqr', self && ph === 'set');

    // 最後の結果
    var end = $('sEnd');
    end.hidden = ph !== 'end';
    if (ph === 'end') {
      var max = s.rounds * 4, g = s.total >= max * .75 ? '名人' : s.total >= max * .5 ? '上手' : '健闘';
      if (set('sEnd', 'end' + s.total + s.round + (s.best ? s.best.d : ''), '<div class="k-result"><small>' + s.rounds + '問の合計（' + (self ? '配信者' : 'みんな') + '）</small><b class="k-num">' + s.total + '<small>点 / ' + max + '点</small></b></div>'
        + '<span class="k-stamp k-stamp-lg' + (g === '健闘' ? ' k-stamp-sumi' : '') + ' k-reveal-stamp" id="sEndStamp">' + g + '</span>'
        + (s.best ? '<p>いちばん近かった: ' + esc(s.best.L) + '〜' + esc(s.best.R) + '（差 ' + s.best.d + '）</p>' : ''))) KKit.reveal($('sEndStamp'));
    }

    var bar = $('sBar');
    if (inRound) {
      if ($('sL').textContent !== s.L || $('sR').textContent !== s.R) { $('sL').textContent = s.L; $('sR').textContent = s.R; KKit.fitText($('sL'), { min: 42 }); KKit.fitText($('sR'), { min: 42 }); }
      var hk = $('sHintK'), hb = $('sHint');
      hk.hidden = self;
      if (self) { hb.textContent = '数字を使わずにヒントをコメント'; hb.className = 'rule'; }
      else { hk.textContent = 'ヒント'; hb.textContent = s.hint ? '「' + s.hint + '」' : 'ヒントを聞いてね'; hb.className = ''; }
      KKit.fitText(hb, { min: 42 });
      var gl = $('sGlabel'), nd = $('sNeedle');
      if (s.guess != null) {
        gl.hidden = false; nd.hidden = false; nd.style.left = s.guess + '%';
        gl.textContent = (self ? '配信者' : 'みんな') + 'の予想 ' + s.guess;
        var half = gl.offsetWidth / 2 / Math.max(1, gl.parentNode.clientWidth) * 100;   // 札が舞台の外に出ないように
        gl.style.left = clamp(s.guess, half, 100 - half) + '%';
      } else { gl.hidden = true; nd.hidden = true; }
      if (ph === 'reveal' && s.target != null) {
        ['z2', 'z3', 'z4'].forEach(function (id, i) { var e = $(id); e.style.left = s.target + '%'; e.style.width = [29, 17, 7][i] + '%'; });
        $('zMark').style.left = s.target + '%';
        var d = Math.abs(s.guess - s.target), p = score(d), k = s.round + ':' + s.target + ':' + s.guess + ':' + s.near;
        bar.classList.toggle('k-ruler-hit', d <= 3);
        if (!bar.classList.contains('k-open')) { void bar.offsetWidth; setTimeout(function () { bar.classList.add('k-open'); }, 30); }
        var ranges = self ? '' : '<p class="ms-ranges"><span class="r4">4点 ' + span(s.target, RANGE[4]) + '</span><span class="r3">3点 ' + span(s.target, RANGE[3]) + '</span><span class="r2">2点 ' + span(s.target, RANGE[2]) + '</span>'
          + (s.near != null ? '<span class="ms-near">近い予想 ' + s.near + '</span>' : '') + '</p>';
        if (set('sFoot', k, '<div class="ms-res k-reveal" id="sRes"><div class="k-result k-result-sm"><small>正解</small><b class="k-num">' + s.target + '</b></div><span class="sa">差 <b class="k-num">' + d + '</b></span>'
          + '<span class="k-stamp' + (p ? '' : ' k-stamp-sumi') + ' k-reveal-stamp" id="sStamp" style="animation-delay:.9s">' + (p + '点') + '</span>' + ranges + '</div>')) {
          var r = $('sRes'); r.style.animationDelay = '.75s'; KKit.reveal(r); KKit.reveal($('sStamp'));
        }
      } else {
        bar.classList.remove('k-open', 'k-ruler-hit');
        ['z2', 'z3', 'z4'].forEach(function (id) { $(id).style.left = '50%'; });
        set('sFoot', 'call' + self, self ? '' : '<p class="ms-call">0〜100 の数字をコメントしてね</p>');
      }
    }
    renderQr();
  }

  function renderQr() {
    var s = S, on = !!(s && s.mode === 'self' && s.phase === 'set' && s.code);
    var big = on && s.qrBig && Date.now() < s.qrUntil;
    $('sQrBig').hidden = !big; $('sQrSmall').hidden = !on || big;
    if (!on) return;
    if (qrFor !== s.code) { qrFor = s.code; qrSvg = window.MO_QR(QR_BASE + s.code); last.sQrBig = last.sQrSmall = null; }
    var pass = s.code.slice(0, 3) + ' ' + s.code.slice(3);
    if (set('sQrBig', 'b' + s.code, '<div class="qrbox">' + qrSvg + '</div><div class="qtx"><p class="q1">答えはスマホで見てね</p><p class="addr">' + ADDR + '</p><p class="pass">合言葉<b>' + pass + '</b></p><p class="rule">数字は書かずにヒント</p><p class="left" id="sQrLeft"></p></div>')) KKit.fitText(document.querySelector('#sQrBig .q1'), { min: 42 });
    set('sQrSmall', 's' + s.code, '<div class="qrbox">' + qrSvg + '</div><div class="k">合言葉</div><b>' + pass + '</b>');
    if (!$('sQrSmall').hidden && renderQr.f !== s.code) { renderQr.f = s.code; KKit.fitText(document.querySelector('#sQrSmall b'), { min: 42 }); }
    if (big) { var l = $('sQrLeft'); if (l) l.textContent = 'あと' + Math.max(0, Math.ceil((s.qrUntil - Date.now()) / 1000)) + '秒で小さくなります'; }
  }
  setInterval(renderQr, 250);
  window.addEventListener('resize', function () { clearTimeout(fitAll.t); fitAll.t = setTimeout(function () { render(); fitAll(); }, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);

  // 操作画面から受け取る（同じブラウザの中だけ）
  KKit.live({ ch: 'kkp-monosashi', role: 'view', onState: function (st) { S = st; render(); } }).start();
  window.__moView = function () { return S; };
})();
</script>
